name = "compass-trigger"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Cloudflare cron is UTC-only and Chicago changes offset twice a year, so each
# slot fires on BOTH candidate UTC hours and the Worker itself checks the real
# Chicago clock before dispatching. Exactly one of the pair passes that check on
# any given day, so there is no DST gap and no duplicate.
#
# Two slots per edition. The first is the trigger; the second is a retry that the
# workflow's shipped-marker turns into a no-op once the edition has gone out.
#
# 13:15/13:45 UTC = 08:15/08:45 CDT   |   14:15/14:45 UTC = 08:15/08:45 CST
# 18:15/18:45 UTC = 13:15/13:45 CDT   |   19:15/19:45 UTC = 13:15/13:45 CST
#
# Weekdays are NAMED, never numbered. Cloudflare counts day-of-week from
# Sunday = 1, so the "1-5" this used to say meant Sunday-Thursday: every Friday
# afternoon edition went undispatched and fell to GitHub's late cron backstop.
# On 2026-10-09 that started at 13:45 CT, fifteen minutes before the send, and
# the edition shipped unedited.
#
# The last two dispatch watchdog.yml instead of compass.yml, twenty minutes after
# each send. GitHub's own watchdog cron ran 2-5 h late and on most weekdays never
# checked the morning edition at all, so a Worker-missed AM had no rescue. The
# Worker matches these strings exactly (event.cron), so change both together.
#
# 14:20/15:20 UTC = 09:20 CDT/CST   |   19:20/20:20 UTC = 14:20 CDT/CST
[triggers]
crons = [
  "15,45 13,14 * * *",        # compass AM
  "15,45 18,19 * * MON-FRI",  # compass PM
  "20 14,15 * * *",           # watchdog AM
  "20 19,20 * * MON-FRI",     # watchdog PM
]

# Without this there are no Worker logs at all, and a missed fire cannot be told
# apart from a fire that dispatched and was rejected. That ambiguity cost an
# afternoon edition on 2026-08-28: the 18:15 UTC fire hit a Worker whose token
# secret was not yet set, and nothing recorded it.
[observability]
enabled = true
head_sampling_rate = 1
