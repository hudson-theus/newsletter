name: diag-probe
on:
  push:
    branches: [claude/diag-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Probe
        env:
          PYTHONUNBUFFERED: "1"
        run: python .github/probe.py
