name: COMPASS

# GitHub's scheduled events are best-effort: on 2026-07-31 a run started 83 minutes
# late, and on 2026-08-03 the run was dropped entirely and the morning edition never
# went out. A single cron per edition cannot survive that.
#
# Delivery is therefore decoupled from execution. Slots fire every 20 minutes across
# a window starting an hour before the target; whichever one succeeds first builds
# the issue and then HOLDS the send until exactly 09:00 or 14:00 CT. So the runner
# may start anywhere in that window and the email still lands on the minute.
#
# The edition is chosen from the Chicago wall clock rather than from which cron
# fired, so drift cannot misattribute a run — and no CDT/CST cron twins are needed.
# A dated artifact marks a shipped edition so later slots stand down; a failed run
# leaves no marker, so the next slot retries.
on:
  schedule:
    # BACKSTOP ONLY — the primary trigger is the Cloudflare Worker. Measured over
    # 2026-08-11..27, GitHub dropped 12 of 112 scheduled fires (11%) and drifted
    # every survivor between 12 and 129 minutes; on 08-27 all four morning fires
    # were dropped outright. So these fire EARLY, and the windows below are wide
    # enough that a fire arriving an hour late still ships the edition.
    - cron: '10 13,14 * * *'     # 08:10 CT (one of the two matches, per DST)
    - cron: '40 13,14 * * *'     # 08:40 CT
    - cron: '20 14,15 * * *'     # 09:20 CT
    - cron: '10 18,19 * * 1-5'   # 13:10 CT
    - cron: '40 18,19 * * 1-5'   # 13:40 CT
    - cron: '20 19,20 * * 1-5'   # 14:20 CT
  workflow_dispatch:
    inputs:
      edition:
        description: Which edition to build
        type: choice
        options: [am, pm]
        default: am
      send:
        description: Send the email (otherwise artifact only)
        type: boolean
        default: false
      force:
        description: Build even if today's edition already shipped
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # claude-code-action authenticates via OIDC
  actions: read     # to see whether today's edition already shipped

concurrency:
  # Two sweep slots must never build the same edition at once.
  group: compass-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide whether to build
        id: cfg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ED="${{ inputs.edition }}"
            [ "${{ inputs.send }}" = "true" ] && SEND="--send" || SEND=""
            echo "manual run: edition=$ED"
          else
            # Edition comes from the Chicago wall clock, not from which cron fired,
            # so drift cannot misattribute a run to the wrong edition.
            HHMM=$(TZ=America/Chicago date +%H%M)
            DOW=$(TZ=America/Chicago date +%u)
            ED=""
            # Sweep starts an hour before the target so several slots get a chance
            # to build before the send time, and continues past it so a run that
            # starts late still delivers (late) rather than not at all.
            # These windows are deliberately wide. On 2026-08-26 both afternoon
            # crons were dropped and two later fires DID start — at 16:10 and
            # 16:48 CT — but the old window ended at 15:20, so both computed an
            # empty edition and stood down. A late edition was available and was
            # thrown away. Late beats never.
            if [ "$HHMM" -ge 0700 ] && [ "$HHMM" -le 1145 ]; then
              ED=am
            elif [ "$HHMM" -ge 1200 ] && [ "$HHMM" -le 1645 ] && [ "$DOW" -le 5 ]; then
              ED=pm
            fi
            if [ -z "$ED" ]; then
              echo "Chicago time $HHMM is outside both edition windows — nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            [ "${{ vars.COMPASS_SEND }}" = "true" ] && SEND="--send" || SEND=""
          fi

          # Already shipped today? Each successful run leaves a dated artifact, so
          # later sweep slots see it and stand down. A failed run leaves none, which
          # is what lets the next slot retry.
          TODAY=$(TZ=America/Chicago date +%F)
          NAME="compass-$ED-$TODAY"
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
                   --jq "[.artifacts[] | select(.name==\"$NAME\" and .expired==false)] | length" \
                   2>/dev/null || echo 0)
          if [ "${{ inputs.force }}" != "true" ] && [ "$COUNT" -gt 0 ]; then
            echo "$NAME already exists — today's $ED edition has shipped. Standing down."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Exact delivery times. The runner may start anywhere in the sweep;
          # publish.py holds the send until this Chicago time.
          [ "$ED" = "am" ] && AT=09:00 || AT=14:00
          echo "building $ED (artifact $NAME, send at $AT CT)"
          {
            echo "skip=false"; echo "edition=$ED"; echo "send=$SEND"
            echo "artifact=$NAME"; echo "at=$AT"
          } >> "$GITHUB_OUTPUT"

      - name: Collect candidates
        if: steps.cfg.outputs.skip == 'false'
        run: python scripts/collect.py --edition "${{ steps.cfg.outputs.edition }}"

      # Never fails the run. A snapshot missing a series costs those numbers; it
      # must not cost the edition.
      - name: Collect market numbers
        if: steps.cfg.outputs.skip == 'false'
        continue-on-error: true
        run: python scripts/market.py

      # Curation is the only stage that can fail for reasons outside this repo.
      # On 2026-08-27 it died in 423ms on an auth rejection and took the whole
      # afternoon edition with it. Three attempts, then a deterministic fallback,
      # so a transient failure can no longer produce zero email.
      - name: Curate issue (attempt 1)
        id: curate1
        if: steps.cfg.outputs.skip == 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read prompts/curate.md and follow it exactly. The edition is
            "${{ steps.cfg.outputs.edition }}". Write issue.json in the repo root.
          claude_args: |
            --max-turns 120
            --allowedTools Read,Write,Edit,Glob,Grep

      - name: Back off before retry
        if: steps.cfg.outputs.skip == 'false' && steps.curate1.outcome == 'failure'
        run: sleep 60

      - name: Curate issue (attempt 2)
        id: curate2
        if: steps.cfg.outputs.skip == 'false' && steps.curate1.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read prompts/curate.md and follow it exactly. The edition is
            "${{ steps.cfg.outputs.edition }}". Write issue.json in the repo root.
          claude_args: |
            --max-turns 120
            --allowedTools Read,Write,Edit,Glob,Grep

      - name: Back off before final retry
        if: steps.cfg.outputs.skip == 'false' && steps.curate2.outcome == 'failure'
        run: sleep 180

      - name: Curate issue (attempt 3)
        id: curate3
        if: steps.cfg.outputs.skip == 'false' && steps.curate2.outcome == 'failure'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read prompts/curate.md and follow it exactly. The edition is
            "${{ steps.cfg.outputs.edition }}". Write issue.json in the repo root.
          claude_args: |
            --max-turns 120
            --allowedTools Read,Write,Edit,Glob,Grep

      # A curated issue.json that is missing, empty, or unparseable is treated the
      # same as a failed step: fall back rather than ship nothing.
      - name: Fall back to an unedited issue if curation never produced one
        if: steps.cfg.outputs.skip == 'false'
        run: |
          if python -c "
          import json,sys
          d=json.load(open('issue.json'))
          n=sum(len(b.get('items',[])) for s in d['sections'] for b in s.get('blocks',[]))
          sys.exit(0 if n else 1)" 2>/dev/null; then
            echo "curated issue.json is present and non-empty"
          else
            echo "::warning::curation produced no usable issue — building the unedited fallback"
            python scripts/fallback.py
          fi

      - name: Verify and publish
        if: steps.cfg.outputs.skip == 'false'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
        run: |
          python scripts/publish.py \
            --edition "${{ steps.cfg.outputs.edition }}" \
            --send-at "${{ steps.cfg.outputs.at }}" \
            ${{ steps.cfg.outputs.send }}

      # Only on full success — this artifact is the "already shipped" marker, so a
      # partial run must not leave one behind or the next slot won't retry.
      - name: Mark shipped
        if: success() && steps.cfg.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.artifact }}
          path: |
            issue_*.html
            issue.json
            candidates.json
          if-no-files-found: warn
          retention-days: 7

      - name: Keep failure output for debugging
        if: failure() && steps.cfg.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: failed-${{ github.run_id }}
          path: |
            issue_*.html
            issue.json
            candidates.json
          if-no-files-found: ignore
          retention-days: 7
